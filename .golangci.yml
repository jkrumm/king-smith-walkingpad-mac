version: "2"

run:
  timeout: 3m
  tests: true

linters:
  exclusions:
    paths:
      # `flatted` (an npm dep) ships a vendored Go file inside node_modules.
      # Not our code — exclude it so the linter doesn't fail on third-party.
      - raycast/node_modules
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: error-naming
    gosec:
      excludes:
        - G104 # Errors unhandled — caught by errcheck where it matters

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
